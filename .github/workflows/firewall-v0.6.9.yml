name: Source Code Security Scan

on:
  pull_request:
    branches: [main, add-pr-scanner]

# Permissions for the automatically generated GITHUB_TOKEN.
# Keep these scoped to what this workflow actually needs.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  security-scan:
    name: SSD Security Firewall
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout the repository code
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch all history for base branch / diff detection
          fetch-depth: 0

      # ============================================================
      # 2. Download the SSD Scanner CLI
      # ============================================================
      - name: Download SSD Scanner CLI
        run: |
          set -e

          curl -L -f -o ssd-scanner-cli \
            https://github.com/OpsMx/ssd-scanner-cli-public/releases/download/v0.6.9/ssd-scanner-cli-amd64

          chmod +x ssd-scanner-cli

          echo "SSD Scanner CLI downloaded successfully."

      # ============================================================
      # 3. Run SSD Security Scan
      ##
      # IMPORTANT:
      # Do NOT use continue-on-error here.
      #
      # The exit code from SSD is the security gate:
      #
      #   exit 0     -> Security scan passed
      #   exit != 0  -> Security scan failed
      #
      # This job is intended to be configured as a required
      # GitHub status check.
      # ============================================================
      - name: Run SSD Security Scan
        id: ssd-scan
        run: |
          set -e

          echo "=============================================="
          echo "       SSD SECURITY FIREWALL"
          echo "=============================================="
          echo "Repository : ${{ github.repository }}"
          echo "PR         : #${{ github.event.number }}"
          echo "Branch     : ${{ github.head_ref }}"
          echo "Commit     : ${{ github.sha }}"
          echo "=============================================="

          echo "Running diff-scan for Pull Request #${{ github.event.number }}"

          ./ssd-scanner-cli \
            --scanners=trivy,syft,semgrep,opengrep \
            --trivy-scanners=codelicensescan,codesecretscan \
            --syft-scanners=sourcecodesbom \
            --repository-url="${{ github.server_url }}/${{ github.repository }}" \
            --source-code-path=. \
            --build-id="${{ github.run_id }}" \
            --branch="${{ github.head_ref }}" \
            --upload-url="${{ secrets.SSD_UPLOAD_URL }}" \
            --ssd-token="${{ secrets.TEAM_TOKEN }}" \
            --pr-id="${{ github.event.number }}" \
            --artifact-name="${{ github.event.repository.name }}" \
            --artifact-type=file \
            --artifact-path=. \
            --artifact-tag="${{ github.sha }}" \
            --git-auth-type=token \
            --git-auth-key="${{ secrets.GH_TOKEN }}" \
            --interrupt-condition="all" \
            --diff-scan="true" \
            --interrupt-for-old-issues=true \
            --keep-results=true \

          echo "=============================================="
          echo "SSD SECURITY SCAN PASSED"
          echo "=============================================="

      # ============================================================
      # 4. Upload SSD findings
      #
      # This MUST run even if the SSD scan fails so that the
      # developer can inspect the results.
      #
      # continue-on-error prevents an artifact upload problem from
      # changing the security decision made by SSD.
      # ============================================================
      - name: Upload Diff Scan Summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diff-scan-summary-pr-${{ github.event.number }}
          path: ~/.local/bin/ssd-scan-results/diff-scan-findings.json
          retention-days: 90
          if-no-files-found: warn

      # ============================================================
      # 5. Comment on the PR with scan results
      #
      # github-script uses the automatically generated GITHUB_TOKEN.
      #
      # It is intentionally NOT using the broad GH_TOKEN/PAT.
      #
      # The workflow-level permissions above provide:
      #
      #   issues: write
      #   pull-requests: write
      #
      # continue-on-error is intentional:
      #
      #   SSD PASS + comment failure = SECURITY PASS
      #   SSD FAIL + comment failure  = SECURITY FAIL
      #
      # Reporting must not override the security decision.
      # ============================================================
      - name: Comment PR with Security Scan Results
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { createPRComment } = require('./.github/workflows/scripts/pr-comment-script.js');

            const secrets = {
              GITHUB_SERVER_URL: '${{ github.server_url }}',
              GITHUB_RUN_ID: '${{ github.run_id }}',
              SSD_UPLOAD_URL: '${{ secrets.SSD_UPLOAD_URL }}'
            };

            await createPRComment(github, context, secrets);

      # ============================================================
      # 6. Show artifact information in workflow logs
      #
      # Informational only. It must never affect the SSD security
      # decision.
      # ============================================================
      - name: Show Artifact Info
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { showArtifactInfo } = require('./.github/workflows/scripts/pr-comment-script.js');

            const secrets = {
              GITHUB_SERVER_URL: '${{ github.server_url }}',
              GITHUB_RUN_ID: '${{ github.run_id }}',
              SSD_UPLOAD_URL: '${{ secrets.SSD_UPLOAD_URL }}'
            };

            showArtifactInfo(context, secrets);
