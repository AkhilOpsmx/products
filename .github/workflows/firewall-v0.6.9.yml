name: Source Code Security Scan

on:
  pull_request:
    branches: [main, add-pr-scanner]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  SSD_IMAGE: docker.io/opsmx11/ssd-scanner-cli:v0.6.13

jobs:
  security-scan:
    name: SSD Security Firewall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull SSD Scanner CLI image
        run: |
          set -e

          docker pull "$SSD_IMAGE"

          echo "SSD Scanner CLI image pulled successfully."

      # The exit code is the security gate - do not add continue-on-error here
      - name: Run SSD Security Scan
        id: ssd-scan
        env:
          SSD_UPLOAD_URL: ${{ secrets.SSD_UPLOAD_URL }}
          SSD_TOKEN: ${{ secrets.TEAM_TOKEN }}
          GIT_AUTH_KEY: ${{ secrets.GH_TOKEN }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
          ARTIFACT_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -e

          echo "=============================================="
          echo "       SSD SECURITY FIREWALL"
          echo "=============================================="
          echo "Repository : $GITHUB_REPOSITORY"
          echo "PR         : #$PR_NUMBER"
          echo "Branch     : $HEAD_REF"
          echo "Commit     : $COMMIT_SHA"
          echo "Image      : $SSD_IMAGE"
          echo "=============================================="

          echo "Running diff-scan for Pull Request #$PR_NUMBER"

          # The image runs as uid 1000, so the results folder must be writable by it
          RESULTS_DIR="$HOME/.local/bin/ssd-scan-results"
          mkdir -p "$RESULTS_DIR"
          chmod 777 "$RESULTS_DIR"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/scanner/source:ro" \
            -v "$RESULTS_DIR:/home/scanner/.local/bin/ssd-scan-results" \
            "$SSD_IMAGE" \
              --scanners=trivy,cdxgen,opengrep \
              --trivy-scanners=codelicensescan,codesecretscan \
              --cdxgen-scanners=sourcecodesbom \
              --repository-url="$REPOSITORY_URL" \
              --source-code-path=/home/scanner/source \
              --build-id="$GITHUB_RUN_ID" \
              --branch="$HEAD_REF" \
              --upload-url="$SSD_UPLOAD_URL" \
              --ssd-token="$SSD_TOKEN" \
              --pr-id="$PR_NUMBER" \
              --artifact-name="$ARTIFACT_NAME" \
              --artifact-type=file \
              --artifact-path=/home/scanner/source \
              --artifact-tag="$COMMIT_SHA" \
              --git-auth-type=token \
              --git-auth-key="$GIT_AUTH_KEY" \
              --interrupt-condition="all" \
              --diff-scan="true" \
              --interrupt-for-old-issues=false \
              --keep-results=true

          echo "=============================================="
          echo "SSD SECURITY SCAN PASSED"
          echo "=============================================="

      - name: Upload Diff Scan Summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: diff-scan-summary-pr-${{ github.event.number }}
          path: ~/.local/bin/ssd-scan-results/diff-scan-findings.json
          retention-days: 90
          if-no-files-found: warn

      - name: Comment PR with Security Scan Results
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { createPRComment } = require('./.github/workflows/scripts/pr-comment-script.js');

            const secrets = {
              GITHUB_SERVER_URL: '${{ github.server_url }}',
              GITHUB_RUN_ID: '${{ github.run_id }}',
              SSD_UPLOAD_URL: '${{ secrets.SSD_UPLOAD_URL }}'
            };

            await createPRComment(github, context, secrets);

      - name: Show Artifact Info
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { showArtifactInfo } = require('./.github/workflows/scripts/pr-comment-script.js');

            const secrets = {
              GITHUB_SERVER_URL: '${{ github.server_url }}',
              GITHUB_RUN_ID: '${{ github.run_id }}',
              SSD_UPLOAD_URL: '${{ secrets.SSD_UPLOAD_URL }}'
            };

            showArtifactInfo(context, secrets);
