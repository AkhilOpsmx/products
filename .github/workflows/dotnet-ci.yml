
name: Inspect .NET Repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: List Solution Files
        run: |
          echo "=== Solution files ==="
          find . -type f \( -name '*.sln' -o -name '*.slnx' \) \
            -not -path './.git/*' -print

      - name: List Available C# Projects
        run: |
          echo "=== C# project files ==="
          find . -type f -name '*.csproj' \
            -not -path './.git/*' -print | sort

      - name: Check Missing Solution References
        run: |
          echo "=== Restore diagnostic ==="
          dotnet restore libs.slnx --verbosity minimal
